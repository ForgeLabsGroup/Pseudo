# Render Blueprint: Next.js web + Fastify API (including in-process jobs).
# The free frontend sleeps when idle; the Starter API keeps publishing jobs running.
services:
  - type: web
    name: pseudo-web
    runtime: node
    branch: main
    autoDeployTrigger: commit
    region: virginia
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @pseudo/web build
    startCommand: pnpm --filter @pseudo/web exec next start --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      # Use the actual public API URL. Changes require a frontend rebuild.
      - key: NEXT_PUBLIC_API_URL
        sync: false
  - type: web
    name: pseudo-api
    runtime: node
    branch: main
    autoDeployTrigger: commit
    region: virginia
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @pseudo/research setup:ytdlp
    startCommand: pnpm --filter @pseudo/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLISH_MODE
        value: mock
      - key: AI_TEXT_PROVIDER
        value: featherless       # mock | openai | featherless (uses FEATHERLESS_API_KEY)
      - key: AI_IMAGE_PROVIDER
        value: mock
      - key: AI_VOICE_PROVIDER
        value: mock
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_VIDEO_PROVIDER
        value: mock
      - key: HF_CREDENTIALS
        sync: false
      - key: RESEARCH_SOURCE
        value: mock
      - key: RESEARCH_WATCHER
        value: mock              # mock | vision | gemini
      - key: RESEARCH_CONCURRENCY
        value: "2"
      - key: APIFY_TOKEN
        sync: false
      - key: FEATHERLESS_API_KEY
        sync: false
      - key: FEATHERLESS_MODEL
        value: deepseek-ai/DeepSeek-V3-0324
      - key: VIDEO_MODEL_NAME
        value: google/gemma-3-27b-it
      - key: VIDEO_FRAMES
        value: "8"
      - key: TRANSCRIBE_PROVIDER
        value: none
      - key: TRANSCRIBE_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        # Must decode to exactly 32 bytes; generate with openssl rand -base64 32.
        sync: false
