# Render Blueprint: Fastify API (+ in-process background jobs & publishing worker).
services:
  - type: web
    name: pseudo-api
    runtime: node
    plan: starter            # free plan sleeps -> first demo request is slow; use starter for demo day
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm --filter @pseudo/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLISH_MODE
        value: mock
      - key: AI_TEXT_PROVIDER
        value: mock
      - key: AI_IMAGE_PROVIDER
        value: mock
      - key: AI_VOICE_PROVIDER
        value: mock
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
